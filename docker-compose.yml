# Docker Compose profiles:
# - test:  forge fmt --check, forge build --sizes and forge test, as CI runs them.
# - local: an anvil chain on ANVIL_PORT with an OwnedCensus deployed.
#
# The forge services build the image from this checkout (submodules included)
# every time, so they always run the current sources. anvil runs the stock
# Foundry image of the same version.

x-census: &census
  build:
    context: .
    args:
      FOUNDRY_VERSION: ${FOUNDRY_VERSION:-v1.8.3}
  image: vocdoni/davinci-onchain-census-contract:local
  pull_policy: build

services:
  test:
    profiles: ["test"]
    <<: *census
    command:
      - |
        set -e
        forge fmt --check
        forge build --sizes
        forge test

  anvil:
    profiles: ["local"]
    image: ghcr.io/foundry-rs/foundry:${FOUNDRY_VERSION:-v1.8.3}
    command: ["exec anvil --host 0.0.0.0 --chain-id 31337 --hardfork osaka --block-time ${ANVIL_BLOCK_TIME:-1}"]
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Deploys once per chain from anvil's dev account 0 (standard test mnemonic),
  # which owns the census. The census links no library.
  deploy-local:
    profiles: ["local"]
    <<: *census
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      ETH_RPC_URL: http://anvil:8545
    command:
      - |
        set -e
        key=$$(cast wallet private-key "test test test test test test test test test test test junk")
        deployer=$$(cast wallet address "$$key")
        if [ "$$(cast nonce "$$deployer")" = 0 ]; then
          forge create src/OwnedCensus.sol:OwnedCensus --private-key "$$key" --broadcast
        else
          echo "Already deployed."
        fi
        echo "OwnedCensus: $$(cast compute-address "$$deployer" --nonce 0 | awk '{print $$NF}')"
        echo "Owner:       $$deployer"
